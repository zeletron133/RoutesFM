<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoutesFM - Virtual DJ Radio Studio</title>
  <style>
    :root {
      --bg-main: #0a0d14;
      --panel-bg: #141923;
      --deck-bg: #1a202c;
      --accent-blue: #00d2ff;
      --accent-green: #00e676;
      --accent-red: #ff3366;
      --text-main: #e2e8f0;
      --text-muted: #64748b;
      --border: #2d3748;
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      padding: 15px;
    }

    .studio-container { max-width: 1200px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 15px;
    }
    header h1 { margin: 0; color: var(--accent-blue); font-size: 1.5rem; letter-spacing: 1px; }

    .dj-console {
      display: grid;
      grid-template-columns: 1fr 220px 1fr;
      gap: 15px;
      margin-bottom: 15px;
    }

    .deck {
      background: var(--deck-bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .deck-a { border-color: rgba(0, 210, 255, 0.4); }
    .deck-b { border-color: rgba(255, 51, 102, 0.4); }

    .deck-header { width: 100%; display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; }
    .deck-a .deck-title { color: var(--accent-blue); }
    .deck-b .deck-title { color: var(--accent-red); }

    .platter-container { margin: 15px 0; }
    .platter {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, #333 15%, #111 20%, #222 60%, #111 100%);
      border: 4px solid #444;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
    }
    .platter-center { width: 35px; height: 35px; border-radius: 50%; background: var(--accent-blue); border: 3px solid #fff; }
    .deck-b .platter-center { background: var(--accent-red); }

    .spinning { animation: spin 2s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .mixer {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .crossfader-container { width: 100%; text-align: center; margin: 10px 0; }
    .crossfader { width: 100%; accent-color: var(--accent-blue); }

    button {
      background: #2b3648;
      color: white;
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { background: #3b495e; }
    .btn-play { background: var(--accent-green); color: black; border: none; }
    .btn-play:hover { background: #00c853; }
    .btn-cue { background: #ff9800; color: black; border: none; }

    .bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 15px;
    }
    .panel h3 { margin-top: 0; font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: 8px; }

    input[type="text"], input[type="password"], select {
      width: 100%;
      padding: 8px 12px;
      background: var(--bg-main);
      border: 1px solid var(--border);
      color: white;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .track-list { list-style: none; padding: 0; max-height: 220px; overflow-y: auto; }
    .track-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: var(--bg-main);
      margin-bottom: 4px;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .track-item button { padding: 3px 8px; font-size: 0.75rem; margin-left: 4px; }
  </style>
</head>
<body>

<div class="studio-container">
  
  <header>
    <h1>🎛️ RoutesFM - Virtual Studio</h1>
    <div>Status: <span id="syncStatus" style="color: var(--accent-green);">Connected</span></div>
  </header>

  <!-- DJ Console -->
  <div class="dj-console">
    
    <!-- DECK A -->
    <div class="deck deck-a">
      <div class="deck-header">
        <span class="deck-title">DECK A</span>
        <span id="deckA-time">00:00</span>
      </div>
      <div id="deckA-title" style="font-size: 0.9rem; color: var(--text-muted); text-align: center; height: 35px;">No Track Loaded</div>
      
      <div class="platter-container">
        <div class="platter" id="platterA">
          <div class="platter-center"></div>
        </div>
      </div>

      <audio id="audioA"></audio>

      <div style="display: flex; gap: 8px; width: 100%; justify-content: center;">
        <button class="btn-play" onclick="playDeck('A')">▶ PLAY</button>
        <button class="btn-cue" onclick="pauseDeck('A')">⏸ PAUSE</button>
      </div>
    </div>

    <!-- MASTER MIXER -->
    <div class="mixer">
      <h4 style="margin: 0; color: var(--text-muted);">MASTER MIXER</h4>
      
      <div style="text-align: center;">
        <label style="font-size: 0.75rem; color: var(--text-muted);">MASTER VOLUME</label><br>
        <input type="range" min="0" max="1" step="0.01" value="0.8" oninput="setMasterVolume(this.value)">
      </div>

      <div class="crossfader-container">
        <label style="font-size: 0.75rem; color: var(--text-muted);">CROSSFADER</label>
        <input type="range" class="crossfader" min="0" max="100" value="50" oninput="updateCrossfader(this.value)">
        <div style="display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted);">
          <span>DECK A</span>
          <span>DECK B</span>
        </div>
      </div>
    </div>

    <!-- DECK B -->
    <div class="deck deck-b">
      <div class="deck-header">
        <span class="deck-title">DECK B</span>
        <span id="deckB-time">00:00</span>
      </div>
      <div id="deckB-title" style="font-size: 0.9rem; color: var(--text-muted); text-align: center; height: 35px;">No Track Loaded</div>

      <div class="platter-container">
        <div class="platter" id="platterB">
          <div class="platter-center"></div>
        </div>
      </div>

      <audio id="audioB"></audio>

      <div style="display: flex; gap: 8px; width: 100%; justify-content: center;">
        <button class="btn-play" onclick="playDeck('B')">▶ PLAY</button>
        <button class="btn-cue" onclick="pauseDeck('B')">⏸ PAUSE</button>
      </div>
    </div>

  </div>

  <!-- Bottom Grid -->
  <div class="bottom-grid">
    
    <!-- Music Crate -->
    <div class="panel">
      <h3>📁 Music Crate & Importer</h3>
      <input type="text" id="archiveUrl" value="https://archive.org/details/forsa-goa-afrobeats-x-tablas" placeholder="Archive URL or ID">
      <button onclick="fetchArchiveTracks()" style="width: 100%; margin-bottom: 12px; background: var(--accent-blue); color: black;">
        Import Album Tracks from Archive
      </button>

      <ul id="crateList" class="track-list">
        <li style="color: var(--text-muted);">Import a URL or load a playlist from GitHub below.</li>
      </ul>
    </div>

    <!-- GitHub Sync & Playlist Selection Panel -->
    <div class="panel">
      <h3>☁️ GitHub Playlist Selector</h3>
      <input type="text" id="ghUser" value="zeletron133" placeholder="GitHub Username">
      <input type="text" id="ghRepo" value="RoutesFM" placeholder="Repository Name">
      <input type="password" id="ghToken" placeholder="Personal Access Token (ghp_...)">
      
      <div style="display: flex; gap: 8px; margin-bottom: 10px;">
        <button onclick="loadPlaylistFromGitHub()" style="flex: 1; background: var(--accent-blue); color: black;">
          🔄 Load Playlist from GitHub
        </button>
        <button onclick="savePlaylistToGitHub()" style="flex: 1; background: var(--accent-green); color: black;">
          💾 Save Crate to GitHub
        </button>
      </div>
    </div>

  </div>

</div>

<script>
  let crateTracks = [];
  const audioA = document.getElementById('audioA');
  const audioB = document.getElementById('audioB');

  // Fetch Tracks from Internet Archive API
  async function fetchArchiveTracks() {
    let input = document.getElementById('archiveUrl').value.trim();
    let identifier = input.includes("archive.org/details/") ? input.split("archive.org/details/")[1].split("/")[0] : input;

    try {
      const res = await fetch(`https://archive.org/metadata/${identifier}`);
      const data = await res.json();
      const mp3s = data.files.filter(f => f.name.endsWith('.mp3'));

      crateTracks = mp3s.map(f => ({
        title: f.title || f.name.replace('.mp3', ''),
        url: `https://archive.org/download/${identifier}/${encodeURIComponent(f.name)}`
      }));

      renderCrate();
    } catch (e) {
      alert("Error fetching tracks from Archive.");
    }
  }

  // Render Crate Tracks
  function renderCrate() {
    const list = document.getElementById('crateList');
    list.innerHTML = '';
    if (crateTracks.length === 0) {
      list.innerHTML = '<li style="color: var(--text-muted);">No tracks in crate.</li>';
      return;
    }

    crateTracks.forEach((t, i) => {
      const li = document.createElement('li');
      li.className = 'track-item';
      li.innerHTML = `
        <span>${i + 1}. ${t.title}</span>
        <div>
          <button onclick="loadToDeck('A', '${t.url}', '${t.title.replace(/'/g, "\\'")}')">Load A</button>
          <button onclick="loadToDeck('B', '${t.url}', '${t.title.replace(/'/g, "\\'")}')">Load B</button>
        </div>
      `;
      list.appendChild(li);
    });
  }

  // Load Track to Deck
  function loadToDeck(deck, url, title) {
    if (deck === 'A') {
      audioA.src = url;
      document.getElementById('deckA-title').innerText = title;
    } else {
      audioB.src = url;
      document.getElementById('deckB-title').innerText = title;
    }
  }

  // Deck Controls
  function playDeck(deck) {
    if (deck === 'A') {
      audioA.play();
      document.getElementById('platterA').classList.add('spinning');
    } else {
      audioB.play();
      document.getElementById('platterB').classList.add('spinning');
    }
  }

  function pauseDeck(deck) {
    if (deck === 'A') {
      audioA.pause();
      document.getElementById('platterA').classList.remove('spinning');
    } else {
      audioB.pause();
      document.getElementById('platterB').classList.remove('spinning');
    }
  }

  function updateCrossfader(val) {
    const valA = Math.cos((val / 100) * (Math.PI / 2));
    const valB = Math.sin((val / 100) * (Math.PI / 2));
    audioA.volume = valA;
    audioB.volume = valB;
  }

  function setMasterVolume(val) {
    audioA.volume = val;
    audioB.volume = val;
  }

  // LOAD Playlist from GitHub `playlists.json`
  async function loadPlaylistFromGitHub() {
    const user = document.getElementById('ghUser').value.trim();
    const repo = document.getElementById('ghRepo').value.trim();
    
    if (!user || !repo) { alert("Please enter your GitHub Username and Repo!"); return; }

    const rawUrl = `https://raw.githubusercontent.com/${user}/${repo}/main/playlists.json`;

    try {
      document.getElementById('syncStatus').innerText = "Fetching playlist...";
      const res = await fetch(rawUrl + '?cache=' + new Date().getTime());
      
      if (!res.ok) {
        alert("playlists.json not found in repository. Try saving a playlist first!");
        return;
      }

      const data = await res.json();
      
      if (data.tracks && Array.isArray(data.tracks)) {
        crateTracks = data.tracks;
      } else if (Array.isArray(data)) {
        crateTracks = data;
      }

      renderCrate();
      document.getElementById('syncStatus').innerText = "Playlist Loaded ✓";
      alert("Successfully loaded playlist from GitHub into your Crate!");

    } catch (e) {
      console.error(e);
      alert("Failed to load playlist from GitHub.");
    }
  }

  // SAVE Playlist to GitHub `playlists.json`
  async function savePlaylistToGitHub() {
    const user = document.getElementById('ghUser').value.trim();
    const repo = document.getElementById('ghRepo').value.trim();
    const token = document.getElementById('ghToken').value.trim();

    if (!token) { alert("Please enter your GitHub Token!"); return; }

    const url = `https://api.github.com/repos/${user}/${repo}/contents/playlists.json`;
    const payload = { tracks: crateTracks, updatedAt: new Date().toISOString() };

    try {
      let sha = "";
      const getFile = await fetch(url, { headers: { "Authorization": `token ${token}` } });
      if (getFile.ok) { const data = await getFile.json(); sha = data.sha; }

      const putFile = await fetch(url, {
        method: "PUT",
        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({
          message: "Update studio playlist crate",
          content: btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2)))),
          sha: sha || undefined
        })
      });

      if (putFile.ok) {
        document.getElementById('syncStatus').innerText = "Synced ✓";
        alert("Playlist successfully saved to GitHub!");
      } else {
        alert("Save failed. Check your GitHub Token permissions.");
      }
    } catch (e) { alert("Error saving to GitHub."); }
  }
</script>

</body>
</html>
